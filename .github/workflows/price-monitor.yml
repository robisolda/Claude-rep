name: Monitor anomalie di prezzo

on:
  schedule:
    - cron: "17 * * * *"   # ogni ora
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Controlla i prezzi e invia notifiche WhatsApp
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
        run: python -m price_monitor

      - name: Salva lo storico dei prezzi
        if: always()
        run: |
          git config user.name "price-monitor[bot]"
          git config user.email "price-monitor[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "Aggiorna storico prezzi"
          git push
